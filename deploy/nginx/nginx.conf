user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Upstream timeouts (overridden per-location, e.g. /api/upload)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    server_tokens off;

    # Video / reel uploads
    client_max_body_size 100M;

    # Docker's embedded DNS: re-resolve container IPs after redeploys
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml image/svg+xml application/manifest+json;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Requests arrive from the host nginx (which terminates SSL):
    # keep the real client IP and the original https scheme.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    include /etc/nginx/conf.d/*.conf;
}
