# HTTP: Let's Encrypt challenges + redirect everything to HTTPS
server {
    listen 80 default_server;
    server_name worknai.media www.worknai.media admin.worknai.media _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.worknai.media;
    include /etc/nginx/snippets/ssl.conf;
    return 301 https://worknai.media$request_uri;
}

# Public website + employee dashboard
server {
    listen 443 ssl default_server;
    http2 on;
    server_name worknai.media;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/app-locations.conf;
}

# Admin panel (Next.js proxy.ts sends "/" -> "/admin" on this host)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.worknai.media;
    include /etc/nginx/snippets/ssl.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/app-locations.conf;
}
