# Internal router (plain HTTP, only reachable from the host via 127.0.0.1).
# SSL, www -> apex redirect and public ports are handled by the host nginx.
server {
    listen 80 default_server;
    server_name worknai.media admin.worknai.media _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/app-locations.conf;
}
