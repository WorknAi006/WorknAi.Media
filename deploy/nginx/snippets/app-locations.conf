# Shared routing for worknai.media and admin.worknai.media
set $web_upstream     http://web:3000;
set $backend_upstream http://backend:5001;

# Next.js API routes (public contact form + media upload)
location = /api/leads {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web_upstream;
}
location = /api/upload {
    include /etc/nginx/snippets/proxy.conf;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_pass $web_upstream;
}

# Everything else under /api -> Express backend
location /api/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $backend_upstream;
}

# Uploaded media (persistent volume) first, then bundled public/videos
location /videos/ {
    root /var/www/uploads;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri @web;
}

location /_next/static/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web_upstream;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web_upstream;
}

location @web {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $web_upstream;
}
