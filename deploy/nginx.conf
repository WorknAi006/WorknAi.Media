# Nginx Configuration for WorknAI Media (72.61.171.164)
# Place in: /etc/nginx/sites-available/worknai.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/worknai.conf /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 72.61.171.164 yourdomain.com www.yourdomain.com;

    # Client Max Body Size for Video / Reel Uploads
    client_max_body_size 100M;

    # Frontend (Next.js) Reverse Proxy -> Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API Reverse Proxy -> Port 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
