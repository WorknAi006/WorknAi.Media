# Host nginx site for worknai.media (shared VPS).
# Installed by: sudo bash /opt/worknai/deploy/scripts/setup-host-nginx.sh
# certbot --nginx adds the SSL (listen 443) lines to this file automatically.

upstream worknai_stack {
    server 127.0.0.1:8390;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.worknai.media;
    return 301 https://worknai.media$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name worknai.media admin.worknai.media;

    client_max_body_size 100M;

    location / {
        proxy_pass http://worknai_stack;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
