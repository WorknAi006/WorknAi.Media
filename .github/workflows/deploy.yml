name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS (72.61.171.164)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '72.61.171.164' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting Deployment on VPS: 72.61.171.164..."

            # 1. Target Directory
            APP_DIR="/var/www/WorknAi.Media"

            if [ ! -d "$APP_DIR" ]; then
              echo "📂 App directory does not exist. Creating and cloning..."
              mkdir -p /var/www
              cd /var/www
              git clone https://github.com/WorknAi006/WorknAi.Media.git WorknAi.Media
              cd "$APP_DIR"
            else
              echo "📂 Entering existing app directory: $APP_DIR"
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # 2. Install Root Dependencies
            echo "📦 Installing npm dependencies..."
            npm install

            # 3. Build Backend
            echo "🔨 Building backend..."
            cd "$APP_DIR/services/backend"
            npm install
            npm run build

            # 4. Build Next.js Web Frontend
            echo "🔨 Building frontend..."
            cd "$APP_DIR/apps/web"
            npm install
            npm run build

            # 5. Reload PM2 Applications
            echo "⚡ Starting / Reloading PM2 processes..."
            cd "$APP_DIR"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

            echo "✅ Deployment completed successfully! WorknAI Media is live! 🚀"
