# Production stack for worknai.media + admin.worknai.media
# Images are built & pushed by GitHub Actions (.github/workflows/deploy.yml).
# On the VPS this lives in /opt/worknai next to a .env file (see .env.example).
#
# This VPS is shared with other apps, so the stack does NOT take ports 80/443.
# The host nginx terminates SSL and forwards worknai traffic to 127.0.0.1:${WORKNAI_HTTP_PORT}
# (see deploy/host-nginx/worknai-media.conf).

name: worknai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/onlinegologistics/worknai-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5001
    expose:
      - "5001"
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/onlinegologistics/worknai-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:5001/api
      UPLOAD_DIR: /app/uploads/videos
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  # Internal router: /api -> backend, /videos -> uploads volume, rest -> web
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKNAI_HTTP_PORT:-8390}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - web
      - backend
    logging: *default-logging

volumes:
  uploads:
