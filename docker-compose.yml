# Production stack for worknai.media + admin.worknai.media
# Images are built & pushed by GitHub Actions (.github/workflows/deploy.yml).
# On the VPS this lives in /opt/worknai next to a .env file (see .env.example).

name: worknai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/onlinegologistics/worknai-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5001
    expose:
      - "5001"
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:-ghcr.io/onlinegologistics/worknai-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:5001/api
      UPLOAD_DIR: /app/uploads/videos
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    # Reload every 6h so renewed certificates are picked up
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      - web
      - backend
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    logging: *default-logging

volumes:
  uploads:
